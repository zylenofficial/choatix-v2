<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phantom V2 — Gaming Optimization</title>
  <meta name="description" content="Phantom V2 — Optimize your PC for maximum gaming performance. 460+ tweaks, FPS boost, system optimization.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scroll-bar" id="scrollBar"></div>
  <div class="noise"></div>

  <canvas id="particleCanvas" class="particle-canvas"></canvas>
  <div class="aurora" id="aurora"></div>

  <div class="cursor-glow" id="cursorGlow"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <nav id="app-nav"></nav>

  <main id="app-content"></main>

  <div id="app-cart"></div>

  <div id="app-footer"></div>

  <button class="chatbot-fab" id="chatbotFab" onclick="toggleChatbot()">
    <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
    <span class="chatbot-fab-badge" id="chatbotBadge">1</span>
  </button>

  <div class="chatbot-window" id="chatbotWindow">
    <div class="chatbot-header">
      <div class="chatbot-header-avatar">&#128161;</div>
      <div class="chatbot-header-info">
        <div class="chatbot-header-name">Phantom Assistant</div>
        <div class="chatbot-header-status">Online</div>
      </div>
      <button class="chatbot-close" onclick="toggleChatbot()">&#10005;</button>
    </div>
    <div class="chatbot-messages" id="chatbotMessages"></div>
    <div class="chat-quick-replies" id="chatbotQuickReplies"></div>
    <div class="chatbot-input">
      <input type="text" id="chatbotInput" placeholder="Type your message..." onkeydown="if(event.key==='Enter')sendChatUserMessage()">
      <button onclick="sendChatUserMessage()"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
    </div>
  </div>

  <script src="particles.js"></script>
  <script src="app.js"></script>

  <!-- License Key Display after Payment -->
  <div id="license-panel" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(10,10,15,0.95); z-index:10000; justify-content:center; align-items:center;">
    <div style="background:#15151f; border:1px solid #2a2a3e; border-radius:16px; padding:40px; max-width:500px; width:90%; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,0.5);">
      <div style="font-size:3rem; margin-bottom:16px;">✅</div>
      <h2 style="color:#00ff9d; margin:0 0 8px; font-size:1.5rem;">Payment Successful!</h2>
      <p style="color:#a0a0b0; margin:0 0 20px;">Your license key is ready</p>
      <div id="license-key" style="font-family:'JetBrains Mono',monospace; font-size:1.1rem; color:#00d4ff; background:#0a0a09; padding:16px; border:1px solid #2a2a3e; border-radius:10px; margin-bottom:24px; word-break:break-all; letter-spacing:1px;"></div>
      <div style="background:#1a1a2e; border:1px solid #5865f2; border-radius:12px; padding:20px; text-align:left;">
        <h3 style="color:#5865f2; margin:0 0 12px; font-size:1rem;">⚡ ACTIVATE ON DISCORD</h3>
        <ol style="color:#e0e0e0; line-height:2; margin:0; padding-left:20px; font-size:0.9rem;">
          <li>Join <a href="https://discord.gg/AhEK85REhG" target="_blank" style="color:#5865f2;">Discord server</a></li>
          <li>Open <b>#tickets</b></li>
          <li>Create a ticket</li>
          <li>Type <code style="background:#0a0a09; padding:2px 8px; border-radius:4px; color:#00ff9d;">/redeem</code> + your key</li>
        </ol>
      </div>
    </div>
  </div>

  <script>
  (function() {
    // Parse session_id from either query string or hash fragment
    var sessionID = null;
    var params = new URLSearchParams(window.location.search);
    sessionID = params.get('session_id');
    
    // If not in query string, check hash fragment (#license?session_id=...)
    if (!sessionID && window.location.hash) {
      var hashStr = window.location.hash.substring(1); // remove #
      var hashParams = new URLSearchParams(hashStr.split('?')[1] || '');
      sessionID = hashParams.get('session_id');
    }
    
    if (!sessionID) return;

    fetch('https://choatix-license-system.onrender.com/api/checkout/capture-order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionID: sessionID })
    })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.licenseKey) {
        document.getElementById('license-key').textContent = d.licenseKey;
        document.getElementById('license-panel').style.display = 'flex';
      }
    })
    .catch(function() { /* silent */ });
  })();
  </script>
</body>
</html>
