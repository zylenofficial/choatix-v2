    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {

      --border: rgba(255,255,255,0.06); --border2: rgba(255,255,255,0.1); --border3: rgba(255,255,255,0.15);

      --purple: #a78bfa; --amber: #fbbf24; --red: #ef4444;
      --gradient: linear-gradient(135deg, #00e676 0%, #00e5ff 100%);
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }

    /* NAV */
    .nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 0 2rem; height: 56px; display: flex; align-items: center; justify-content: space-between; background: rgba(10,10,10,0.85); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); }
    .nav-brand { font-size: 1.05rem; font-weight: 900; color: #fff; text-decoration: none; letter-spacing: -0.02em; }
    .nav-brand span { color: var(--green); }
    .nav-back { font-size: 0.72rem; color: var(--text-dim); text-decoration: none; display: flex; align-items: center; gap: 0.4rem; transition: color 0.2s; }
    .nav-back:hover { color: #fff; }

    /* PAGE */
    .page { display: flex; min-height: 100vh; padding-top: 56px; }

    /* SIDEBAR */
    .sidebar { width: 340px; min-width: 340px; background: var(--bg2); border-right: 1px solid var(--border); padding: 2rem 1.75rem; display: flex; flex-direction: column; position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto; }
    .sidebar::-webkit-scrollbar { width: 3px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    .product-badge { display: inline-block; font-size: 0.55rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; padding: 0.25rem 0.65rem; border-radius: 5px; margin-bottom: 1rem; }
    .badge-default { background: var(--green-dim); color: var(--green); }
    .badge-purple { background: rgba(167,139,250,0.12); color: var(--purple); }
    .badge-amber { background: rgba(251,191,36,0.12); color: var(--amber); }
    .badge-red { background: rgba(239,68,68,0.12); color: var(--red); }

    .product-name { font-size: 1.4rem; font-weight: 900; color: #fff; margin-bottom: 0.2rem; letter-spacing: -0.02em; line-height: 1.2; }
    .product-brand { font-size: 0.6rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 1.25rem; }

    .product-pricing { display: flex; align-items: baseline; gap: 0.6rem; margin-bottom: 1.5rem; }
    .product-price-old { font-size: 0.9rem; color: var(--text-dim); text-decoration: line-through; }
    .product-price { font-size: 2rem; font-weight: 900; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .product-save { font-size: 0.55rem; font-weight: 800; color: var(--green); background: var(--green-dim); padding: 0.2rem 0.5rem; border-radius: 4px; letter-spacing: 0.05em; }

    .sidebar-divider { height: 1px; background: var(--border); margin: 0.25rem 0 1.25rem; }

    .sidebar-rating { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1.25rem; }
    .sidebar-rating .stars { color: #facc15; font-size: 0.85rem; letter-spacing: 1px; }
    .sidebar-rating .count { font-size: 0.7rem; color: var(--text-dim); }

    .sidebar-info { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 1.5rem; }
    .sidebar-info-item { display: flex; align-items: center; gap: 0.5rem; font-size: 0.72rem; color: var(--text-mid); }
    .sidebar-info-item .icon { color: var(--green); font-size: 0.8rem; }

    .buy-btn {
      width: 100%; padding: 0.8rem; border-radius: 10px; border: none; background: var(--gradient);
      color: #000; font-size: 0.85rem; font-weight: 800; cursor: pointer; transition: all 0.25s;
      font-family: inherit; text-transform: uppercase; letter-spacing: 0.06em;
    }
    .buy-btn:hover { box-shadow: 0 0 32px rgba(0,230,118,0.25), 0 0 64px rgba(0,229,255,0.15); transform: translateY(-2px); }
    .buy-btn:active { transform: translateY(0); }

    .sidebar-footer { margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--border); font-size: 0.6rem; color: var(--text-dim); text-align: center; line-height: 1.6; }

    /* MAIN */
    .main { flex: 1; padding: 2.5rem 3rem; max-width: 840px; }

    /* HERO */
    .hero { margin-bottom: 2.5rem; }

    .hero-card {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 14px;
      padding: 2rem; position: relative; overflow: hidden;
    }
    .hero-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: var(--gradient); opacity: 0.6;

    .hero-card p { font-size: 0.82rem; color: var(--text-mid); line-height: 1.75; }

    /* INCLUDES */

    .section-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-dim); margin-bottom: 1rem; }
    .includes-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
    .include-item {

    }
    .include-item:hover { border-color: var(--border2); background: var(--bg3); }
    .include-check { color: var(--green); font-size: 0.7rem; flex-shrink: 0; }

    /* CATEGORIES */
    .categories { margin-bottom: 2.5rem; }
    .categories-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .cat-card {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
      padding: 1.1rem; transition: border-color 0.25s, transform 0.25s; cursor: default;
    }
    .cat-card:hover { border-color: var(--border3); transform: translateY(-1px); }
    .cat-header { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.5rem; }
    .cat-icon {
      width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; flex-shrink: 0;
    }
    .cat-icon.green { background: var(--green-dim); color: var(--green); }
    .cat-icon.cyan { background: var(--cyan-dim); color: var(--cyan); }
    .cat-icon.purple { background: rgba(167,139,250,0.12); color: var(--purple); }
    .cat-icon.amber { background: rgba(251,191,36,0.12); color: var(--amber); }
    .cat-name { font-size: 0.78rem; font-weight: 700; color: #fff; }
    .cat-desc { font-size: 0.68rem; color: var(--text-dim); line-height: 1.55; margin-bottom: 0.5rem; }
    .cat-count { font-size: 0.6rem; color: var(--text-dim); font-weight: 600; }
    .cat-count span { color: var(--cyan); }

    /* OUTCOME */
    .outcome { margin-bottom: 2.5rem; }
    .outcome-card {
      background: var(--green-dim); border: 1px solid rgba(0,230,118,0.15); border-radius: 12px;

    }
    .outcome-icon { font-size: 1.5rem; }
    .outcome-text { font-size: 0.82rem; color: var(--green); font-weight: 600; line-height: 1.5; }

    /* REVIEWS */
    .reviews { margin-bottom: 2.5rem; }
    .reviews-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .reviews-avg { display: flex; align-items: baseline; gap: 0.5rem; }
    .reviews-avg-num { font-size: 2rem; font-weight: 900; color: #fff; }
    .reviews-avg-stars { color: #facc15; font-size: 0.9rem; }
    .reviews-avg-count { font-size: 0.7rem; color: var(--text-dim); }
    .review-list { display: flex; flex-direction: column; gap: 0.75rem; }
    .review-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.25rem; }
    .review-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.5rem; }
    .review-user { font-size: 0.75rem; font-weight: 600; color: var(--text-light); }
    .review-stars { color: #facc15; font-size: 0.7rem; }
    .review-text { font-size: 0.72rem; color: var(--text-dim); line-height: 1.6; }
    .review-empty { font-size: 0.72rem; color: var(--text-dim); text-align: center; padding: 2rem; }

    /* TOS */
    .tos { font-size: 0.62rem; color: var(--text-dim); padding-top: 1.25rem; border-top: 1px solid var(--border); line-height: 1.7; }
    .tos strong { color: var(--text-mid); }

    @media (max-width: 768px) {
      .page { flex-direction: column; }
      .sidebar { width: 100%; min-width: 0; position: static; height: auto; padding: 1.5rem; }
      .main { padding: 1.5rem; }
      .includes-grid, .categories-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

                '<div class="cat-header">' +
                  '<div class="cat-icon ' + c.iconClass + '">' + c.icon + '</div>' +
                  '<div class="cat-name">' + c.name + '</div>' +
                '</div>' +
                '<div class="cat-desc">' + c.desc + '</div>' +
                '<div class="cat-count"><span>' + c.count + '</span> tweaks</div>' +
              '</div>'
            ).join('') +
          '</div>' +
        '</div>' +
        '<div class="reviews">' +
          '<div class="section-label">Reviews</div>' +
          '<div class="reviews-header">' +
            '<div class="reviews-avg">' +
              '<span class="reviews-avg-num" id="avgNum">--</span>' +
              '<span class="reviews-avg-stars" id="avgStars"></span>' +
              '<span class="reviews-avg-count" id="avgCount"></span>' +
            '</div>' +
          '</div>' +
          '<div class="review-list" id="reviewList"><div class="review-empty">Loading reviews...</div></div>' +
        '</div>' +
        '<div class="tos"><strong>Terms:</strong> ' + p.tos + '</div>';

      fetchReviews(id);
    }

    function fetchReviews(id) {
      fetch('https://choatix-v2.onrender.com/api/ratings/' + id)
        .then(r => r.json())
        .then(data => {
          const avg = parseFloat(data.avg) || 0;
          const count = parseInt(data.count) || 0;

          document.getElementById('sidebarStars').textContent = renderStars(avg);
          document.getElementById('sidebarCount').textContent = '(' + count + ' review' + (count !== 1 ? 's' : '') + ')';
          document.getElementById('avgNum').textContent = avg.toFixed(1);
          document.getElementById('avgStars').textContent = renderStars(avg);
          document.getElementById('avgCount').textContent = count + ' review' + (count !== 1 ? 's' : '');

          if (data.reviews && data.reviews.length > 0) {
            document.getElementById('reviewList').innerHTML = data.reviews.map(r =>
              '<div class="review-card">' +
                '<div class="review-top">' +
                  '<span class="review-user">' + escapeHtml(r.discord_username || 'Anonymous') + '</span>' +
                  '<span class="review-stars">' + renderStars(r.rating) + '</span>' +
                '</div>' +
                (r.comment ? '<div class="review-text">' + escapeHtml(r.comment) + '</div>' : '') +
              '</div>'
            ).join('');
          } else {
            document.getElementById('reviewList').innerHTML =
              '<div class="review-card"><div class="review-empty">No reviews yet. Be the first to review!</div></div>';
          }
        })
        .catch(() => {
          document.getElementById('sidebarStars').textContent = '\u2606\u2606\u2606\u2606\u2606';
          document.getElementById('sidebarCount').textContent = '(0 reviews)';
          document.getElementById('avgNum').textContent = '0.0';
          document.getElementById('reviewList').innerHTML =
            '<div class="review-card"><div class="review-empty">No reviews yet.</div></div>';
        });
    }

    function renderStars(rating) {
      const full = Math.floor(rating);
      const half = rating - full >= 0.5;
      let s = '';
      for (let i = 0; i < 5; i++) {
        if (i < full) s += '\u2605';
        else if (i === full && half) s += '\u2605';
        else s += '\u2606';
      }
      return s;
    }

    function escapeHtml(text) {
      const d = document.createElement('div');
      d.textContent = text;
      return d.innerHTML;
    }

    render();
  </script>
</body>
</html>
