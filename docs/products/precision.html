<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">Choatix V2 - Product</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0a0a; --bg2: #111111; --bg3: #181818;
      --border: rgba(255,255,255,0.06); --border2: rgba(255,255,255,0.1); --border3: rgba(255,255,255,0.15);
      --text: #fafafa; --text-dim: #555; --text-mid: #888;
      --green: #00e676; --cyan: #00e5ff;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    .nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; background: rgba(10,10,10,0.8); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
    .nav-brand { font-size: 1.1rem; font-weight: 900; color: #fff; text-decoration: none; }
    .nav-brand span { color: var(--green); }
    .nav-back { font-size: 0.75rem; color: var(--text-dim); text-decoration: none; display: flex; align-items: center; gap: 0.4rem; transition: color 0.2s; }
    .nav-back:hover { color: #fff; }

    .page { display: flex; min-height: 100vh; padding-top: 60px; }

    .sidebar { width: 320px; min-width: 320px; background: var(--bg2); border-right: 1px solid var(--border); padding: 2rem; display: flex; flex-direction: column; position: sticky; top: 60px; height: calc(100vh - 60px); overflow-y: auto; }
    .sidebar::-webkit-scrollbar { width: 3px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    .product-badge { display: inline-block; font-size: 0.55rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; padding: 0.25rem 0.6rem; border-radius: 4px; background: rgba(0,230,118,0.1); color: var(--green); margin-bottom: 0.75rem; }
    .product-badge.purple { background: rgba(124,77,255,0.1); color: #a78bfa; }
    .product-badge.blue { background: rgba(59,130,246,0.1); color: #60a5fa; }
    .product-badge.amber { background: rgba(245,158,11,0.1); color: #fbbf24; }

    .product-name { font-size: 1.5rem; font-weight: 900; color: #fff; margin-bottom: 0.25rem; }
    .product-brand { font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 1rem; }

    .product-pricing { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.5rem; }
    .product-price-old { font-size: 1rem; color: var(--text-dim); text-decoration: line-through; }
    .product-price { font-size: 1.75rem; font-weight: 900; color: var(--cyan); }
    .product-save { font-size: 0.6rem; font-weight: 700; color: #00e676; background: rgba(0,230,118,0.1); padding: 0.2rem 0.5rem; border-radius: 4px; }

    .discord-input { margin-bottom: 1.25rem; }
    .discord-input label { display: block; font-size: 0.7rem; font-weight: 600; color: var(--text-mid); margin-bottom: 0.4rem; }
    .discord-input input {
      width: 100%; padding: 0.65rem 0.85rem; border-radius: 8px; border: 1px solid var(--border2);
      background: var(--bg); color: #fff; font-size: 0.8rem; font-family: inherit;
      transition: border-color 0.2s; outline: none;
    }
    .discord-input input:focus { border-color: var(--cyan); }
    .discord-input input::placeholder { color: var(--text-dim); }

    .add-to-cart {
      width: 100%; padding: 0.75rem; border-radius: 8px; border: none; background: var(--cyan);
      color: #000; font-size: 0.85rem; font-weight: 800; cursor: pointer; transition: all 0.2s;
      font-family: inherit; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .add-to-cart:hover { box-shadow: 0 0 24px rgba(0,229,255,0.3); transform: translateY(-1px); }

    .sidebar-rating { display: flex; align-items: center; gap: 0.4rem; margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid var(--border); }
    .sidebar-rating .stars { color: #facc15; font-size: 0.8rem; }
    .sidebar-rating .count { font-size: 0.7rem; color: var(--text-dim); }

    .main { flex: 1; padding: 2.5rem 3rem; max-width: 800px; }

    .section-title { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 1rem; }

    .description { font-size: 0.85rem; color: var(--text-mid); line-height: 1.7; margin-bottom: 2rem; }

    .includes-list { list-style: none; display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 2rem; }
    .includes-list li { font-size: 0.8rem; color: var(--text-mid); display: flex; align-items: flex-start; gap: 0.6rem; line-height: 1.5; }
    .includes-list li::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--green); margin-top: 0.4rem; flex-shrink: 0; }

    .tweak-categories { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 2rem; }
    .tweak-cat {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
      padding: 1rem; transition: border-color 0.2s;
    }
    .tweak-cat:hover { border-color: var(--border2); }
    .tweak-cat-header { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
    .tweak-cat-num {
      font-size: 0.6rem; font-weight: 800; color: var(--cyan); background: rgba(0,229,255,0.08);
      width: 22px; height: 22px; border-radius: 5px; display: flex; align-items: center; justify-content: center;
    }
    .tweak-cat-name { font-size: 0.8rem; font-weight: 700; color: #fff; }
    .tweak-cat-desc { font-size: 0.7rem; color: var(--text-dim); line-height: 1.5; }
    .tweak-cat-count { font-size: 0.6rem; color: var(--text-dim); margin-top: 0.4rem; }

    .tos { font-size: 0.65rem; color: var(--text-dim); margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--border); }
    .tos strong { color: var(--text-mid); }

    @media (max-width: 768px) {
      .page { flex-direction: column; }
      .sidebar { width: 100%; min-width: 0; position: static; height: auto; padding: 1.5rem; }
      .main { padding: 1.5rem; }
      .tweak-categories { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <a href="../index.html" class="nav-brand">choatix<span>.</span></a>

    function getUrlParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    function render() {
      const id = getUrlParam('id') || 'precision';
      const p = products[id];
      if (!p) { document.body.innerHTML = '<p style="padding:4rem;text-align:center;color:#666;">Product not found.</p>'; return; }

      document.getElementById('pageTitle').textContent = 'Choatix V2 - ' + p.name;

      const badgeHtml = p.badge ? '<div class="product-badge ' + p.badgeClass + '">' + p.badge + '</div>' : '';
      const oldPriceHtml = p.oldPrice ? '<span class="product-price-old">' + p.oldPrice + '</span>' : '';
      const saveHtml = p.save ? '<span class="product-save">' + p.save + '</span>' : '';
      const outcomeHtml = p.outcome ? '<div style="margin-top:1rem;"><div class="section-title">Outcome</div><p style="font-size:0.8rem;color:var(--green);font-weight:600;">' + p.outcome + '</p></div>' : '';

      document.getElementById('sidebar').innerHTML =
        badgeHtml +
        '<div class="product-name">' + p.name + '</div>' +
        '<div class="product-brand">by ' + p.brand + '</div>' +
        '<div class="product-pricing">' + oldPriceHtml + '<span class="product-price">' + p.price + '</span>' + saveHtml + '</div>' +
        '<div class="discord-input">' +
          '<label>Discord Username</label>' +
          '<input type="text" placeholder="username" id="discordInput">' +
        '</div>' +
        '<button class="add-to-cart" onclick="addToCart(\'' + id + '\')">Add to Cart</button>' +
        '<div class="sidebar-rating"><span class="stars" id="sidebarStars"></span><span class="count" id="sidebarCount"></span></div>';

      document.getElementById('main').innerHTML =
        '<div class="section-title">Pro Tweaking Panel: ' + (p.categories.reduce((a,c)=>a+c.count,0)) + '+ Tweaks, Significant FPS Boost, Close to 0 Input Delay, Overall Performance Boost.</div>' +
        '<div class="description">' + p.description + '</div>' +
        '<div class="section-title">Includes:</div>' +
        '<ul class="includes-list">' + p.includes.map(i => '<li>' + i + '</li>').join('') + '</ul>' +
        outcomeHtml +
        '<div class="section-title">What\'s Included</div>' +
        '<div class="tweak-categories">' +
          p.categories.map((c, i) =>
            '<div class="tweak-cat">' +
              '<div class="tweak-cat-header"><div class="tweak-cat-num">' + (i+1) + '</div><div class="tweak-cat-name">' + c.name + '</div></div>' +
              '<div class="tweak-cat-desc">' + c.desc + '</div>' +
              '<div class="tweak-cat-count">' + c.count + ' tweaks</div>' +
            '</div>'
          ).join('') +
        '</div>' +
        '<div class="tos"><strong>TOS:</strong> ' + p.tos + '</div>';

      fetch('https://choatix-v2.onrender.com/api/ratings/' + id)
        .then(r => r.json())
        .then(data => {
          const avg = parseFloat(data.avg) || 0;
          const count = parseInt(data.count) || 0;
          const full = Math.floor(avg);
          const half = avg - full >= 0.5;
          let s = '';
          for (let i = 0; i < 5; i++) {
            if (i < full) s += '\u2605';
            else if (i === full && half) s += '\u2605';
            else s += '\u2606';
          }
          document.getElementById('sidebarStars').textContent = s;
          document.getElementById('sidebarCount').textContent = '(' + count + ')';
        })
        .catch(() => {
          document.getElementById('sidebarStars').textContent = '\u2606\u2606\u2606\u2606\u2606';
          document.getElementById('sidebarCount').textContent = '(0)';
        });
    }

    function addToCart(productId) {
      const username = document.getElementById('discordInput').value.trim();
      if (!username) { alert('Please enter your Discord username.'); return; }
      window.location.href = '../index.html#pricing';
    }

    render();
  </script>
