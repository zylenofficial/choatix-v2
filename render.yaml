services:
  - type: web
    name: phantom-license
    runtime: node
    plan: free
    autoDeployTrigger: commit
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: OWNER_DISCORD_ID
        value: "1014494449809772544"
      - key: BASE_URL
        value: "https://phantom-license-dy15.onrender.com"
