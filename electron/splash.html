<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    -webkit-app-region: drag;
    user-select: none;
  }

  #rain {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
  }

  .content {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 300px;
  }

  .logo-glow {
    width: 100px; height: 100px;
    background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
    border-radius: 50%;
    opacity: 0;
    animation: fadeIn 1.2s 0.5s ease-out forwards;
  }
  .logo {
    width: 70px; height: auto;
    margin-top: -85px;
    position: relative; z-index: 2;
    opacity: 0;
    animation: logoIn 1s 0.3s cubic-bezier(0.16,1,0.3,1) forwards;
    filter: brightness(0) invert(1);
  }
  @keyframes logoIn {
    from { opacity: 0; transform: scale(0.88); }
    to   { opacity: 1; transform: scale(1); }
  }

  .ring-wrap {
    margin-top: 22px;
    width: 36px; height: 36px;
    opacity: 0;
    animation: fadeIn 0.6s 1.2s ease-out forwards;
  }
  .ring-track { fill: none; stroke: rgba(255,255,255,0.06); stroke-width: 1.5; }
  .ring-fill {
    fill: none; stroke: rgba(255,255,255,0.4); stroke-width: 1.5;
    stroke-linecap: round; stroke-dasharray: 101; stroke-dashoffset: 101;
    transform: rotate(-90deg); transform-origin: center;
    animation: ringFill 2s 1.5s cubic-bezier(0.4,0,0.2,1) forwards;
  }
  @keyframes ringFill { to { stroke-dashoffset: 0; } }

  .name {
    margin-top: 22px; font-size: 14px; font-weight: 600;
    letter-spacing: 14px; text-indent: 14px;
    background: linear-gradient(90deg,
      rgba(255,255,255,0.2) 0%, rgba(255,255,255,0.2) 30%,
      rgba(255,255,255,0.9) 50%, rgba(255,255,255,0.2) 70%,
      rgba(255,255,255,0.2) 100%);
    background-size: 250% 100%; background-position: 100% 0;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    opacity: 0;
    animation: fadeIn 0.01s 0.8s forwards, shimmer 3s 0.8s ease-in-out infinite;
  }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

  .tagline {
    margin-top: 8px; font-size: 8px; letter-spacing: 5px; text-indent: 5px;
    color: rgba(255,255,255,0.15);
    opacity: 0; animation: fadeIn 0.8s 1s ease-out forwards;
  }

  .status {
    margin-top: 30px; font-size: 8px; letter-spacing: 3px;
    color: rgba(255,255,255,0.22);
    font-family: 'Consolas','SF Mono',monospace;
    min-height: 14px;
    opacity: 0; animation: fadeIn 0.4s 1.6s ease-out forwards;
  }
  .cursor { animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .ver {
    margin-top: 14px; font-size: 7px; letter-spacing: 3px;
    color: rgba(255,255,255,0.05);
    font-family: 'Consolas','SF Mono',monospace;
    opacity: 0; animation: fadeIn 0.5s 2.4s ease-out forwards;
  }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>
  <canvas id="rain"></canvas>

  <div class="content">
    <div class="logo-glow"></div>
    <img src="choatix-logo.png" class="logo" alt="" />

    <div class="ring-wrap">
      <svg viewBox="0 0 36 36" width="36" height="36">
        <circle class="ring-track" cx="18" cy="18" r="16" />
        <circle class="ring-fill" cx="18" cy="18" r="16" />
      </svg>
    </div>

    <div class="name">PHANTOM</div>
    <div class="tagline">GAMING PERFORMANCE OPTIMIZER</div>
    <div class="status" id="status"></div>
    <div class="ver">v2.3.1</div>
  </div>

  <script>
    const canvas = document.getElementById('rain');
    const ctx = canvas.getContext('2d');
    const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789ΣΩλπφψ'.split('');
    const FONT_SIZE = 14;
    const CHAR_SPACING = 18;
    let W, H, cols = [];

    function init() {
      const dpr = window.devicePixelRatio || 1;
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      cols = [];
      const numCols = Math.floor(W / CHAR_SPACING);
      for (let i = 0; i < numCols; i++) {
        // Only ~40% of columns have rain (denser near center)
        const cx = W / 2;
        const dist = Math.abs(i * CHAR_SPACING - cx) / (W / 2);
        const chance = dist < 0.3 ? 0.9 : dist < 0.6 ? 0.5 : 0.15;
        if (Math.random() > chance) continue;

        const speed = 1.2 + Math.random() * 2.5;
        const trailLen = 8 + Math.floor(Math.random() * 14);
        const chars = [];
        for (let j = 0; j < trailLen; j++) {
          chars.push(CHARS[Math.floor(Math.random() * CHARS.length)]);
        }
        cols.push({
          x: i * CHAR_SPACING + CHAR_SPACING / 2,
          y: Math.random() * H * 1.5 - H * 0.5,
          speed,
          chars,
          flickerTimer: 0,
          flickerRate: 3 + Math.floor(Math.random() * 5)
        });
      }
    }
    init();
    window.addEventListener('resize', init);

    let frame = 0;
    function draw() {
      // Slow fade for trails — less blur = more distinct characters
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(0, 0, W, H);

      ctx.font = FONT_SIZE + 'px Consolas, "SF Mono", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';

      for (const col of cols) {
        col.y += col.speed;
        col.flickerTimer++;

        // Flicker: swap random chars in the trail
        if (col.flickerTimer >= col.flickerRate) {
          col.flickerTimer = 0;
          const idx = Math.floor(Math.random() * col.chars.length);
          col.chars[idx] = CHARS[Math.floor(Math.random() * CHARS.length)];
        }

        for (let j = 0; j < col.chars.length; j++) {
          const cy = col.y - j * CHAR_SPACING;
          if (cy < -FONT_SIZE || cy > H + FONT_SIZE) continue;

          let alpha;
          if (j === 0) {
            // HEAD: bright white
            alpha = 0.95;
          } else if (j < 3) {
            // Near head: still bright
            alpha = 0.6 - j * 0.1;
          } else {
            // Trail: fades out
            alpha = Math.max(0.02, 0.45 * Math.pow(0.82, j - 2));
          }

          // Edge fades
          if (cy < 80) alpha *= cy / 80;
          if (cy > H - 60) alpha *= (H - cy) / 60;
          alpha = Math.max(0, Math.min(1, alpha));

          // Head gets a subtle glow
          if (j === 0) {
            ctx.shadowColor = 'rgba(255,255,255,0.4)';
            ctx.shadowBlur = 6;
          } else {
            ctx.shadowBlur = 0;
          }

          ctx.fillStyle = `rgba(255,255,255,${alpha})`;
          ctx.fillText(col.chars[j], col.x, cy);
        }
        ctx.shadowBlur = 0;

        // Reset when fully off screen
        if (col.y - col.chars.length * CHAR_SPACING > H) {
          col.y = -CHAR_SPACING * 2;
          col.speed = 1.2 + Math.random() * 2.5;
          col.chars = [];
          const trailLen = 8 + Math.floor(Math.random() * 14);
          for (let j = 0; j < trailLen; j++) {
            col.chars.push(CHARS[Math.floor(Math.random() * CHARS.length)]);
          }
        }
      }

      frame++;
      requestAnimationFrame(draw);
    }
    draw();

    // ── Typewriter ──
    const phrases = ['INITIALIZING','LOADING MODULES','SCANNING SYSTEM','READY'];
    const el = document.getElementById('status');
    let pi = 0;
    function typePhrase(t, cb) {
      let ci = 0;
      el.innerHTML = '<span class="cursor">_</span>';
      const iv = setInterval(() => {
        ci++;
        if (ci > t.length) { clearInterval(iv); if (cb) cb(); return; }
        el.innerHTML = t.substring(0, ci) + '<span class="cursor">_</span>';
      }, 40);
    }
    function cycle() {
      if (pi >= phrases.length) return;
      typePhrase(phrases[pi], () => {
        pi++;
        if (pi < phrases.length) {
          setTimeout(() => {
            el.style.opacity = '0';
            setTimeout(() => { el.style.opacity = '1'; cycle(); }, 120);
          }, 350);
        }
      });
    }
    setTimeout(cycle, 1800);
  </script>
</body>
</html>
